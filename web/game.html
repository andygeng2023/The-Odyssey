<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$GODOT_PROJECT_NAME</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#101820;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#game{display:block;width:100%;height:100%;border:0}
#status{position:fixed;left:16px;right:16px;bottom:16px;padding:10px 12px;background:rgba(0,0,0,.75);font:14px monospace;z-index:2}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">Starting The Odyssey…</div>
<script src="$GODOT_URL"></script>
<script>
const status = document.getElementById("status");
const setStatus = (text) => { status.textContent = text; };
const engine = new Engine($GODOT_CONFIG);
engine.startGame({
  canvas: document.getElementById("game"),
  onProgress: (current, total) => {
    if (total > 0) setStatus("Loading The Odyssey… " + Math.round(current / total * 100) + "%");
    else setStatus("Loading The Odyssey…");
  },
  onPrint: (text) => console.log("[Godot]", text),
  onPrintError: (text) => {
    console.error("[Godot]", text);
    setStatus("Godot error: " + text);
  }
}).then(() => {
  status.remove();
}).catch((error) => {
  console.error("[Godot startup]", error);
  setStatus("Game failed to start: " + (error?.message || error));
});
</script>
</body>
</html>
