<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>$GODOT_PROJECT_NAME</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1116;color:#fff;overflow:hidden;font-family:system-ui,sans-serif}
#canvas{display:block;width:100%;height:100%;outline:none}
#status{position:fixed;left:16px;right:16px;bottom:16px;max-width:900px;padding:12px 14px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;z-index:10;white-space:pre-wrap}
.hidden{display:none}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="The Odyssey game"></canvas>
<div id="status">Starting The Odyssey…</div>
<script src="$GODOT_URL"></script>
<script>
(() => {
  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");
  const setStatus = (text) => { status.textContent = text; status.classList.remove("hidden"); };
  const clearStatus = () => status.classList.add("hidden");

  if (!window.WebAssembly) {
    setStatus("This browser does not support WebAssembly.");
    return;
  }
  if (typeof Engine === "undefined") {
    setStatus("Godot Web engine failed to load. Check the JavaScript asset in the browser network panel.");
    return;
  }

  const engine = new Engine($GODOT_CONFIG);
  let lastProgress = "";

  engine.startGame({
    canvas,
    onProgress: (current, total) => {
      if (total > 0) {
        const percent = Math.max(0, Math.min(100, Math.round(current / total * 100)));
        const next = "Loading The Odyssey… " + percent + "%";
        if (next !== lastProgress) {
          lastProgress = next;
          setStatus(next);
        }
      } else {
        setStatus("Loading The Odyssey…");
      }
    },
    onPrint: (...args) => console.log("[Godot]", ...args),
    onPrintError: (...args) => {
      console.error("[Godot]", ...args);
      setStatus("Godot startup error:\n" + args.join(" "));
    }
  }).then(() => {
    clearStatus();
    canvas.focus();
  }).catch((error) => {
    console.error("[Godot startup]", error);
    setStatus("The game could not start.\n" +
      (error && error.message ? error.message : String(error)) +
      "\n\nOpen the browser developer console for the failed asset request.");
  });
})();
</script>
</body>
</html>
