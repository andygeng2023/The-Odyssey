name: Deploy The Odyssey
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odyssey-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "4.5.1-stable"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig ca-certificates curl unzip

      - name: Install Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          godot_binary="$(find /tmp/godot -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$godot_binary"
          install -m 0755 "$godot_binary" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          templates_root="$HOME/.local/share/godot/export_templates"
          templates_dir="$templates_root/${GODOT_VERSION}.stable"
          tmp_templates="$(mktemp -d)"
          mkdir -p "$templates_dir"

          curl -fsSL -o /tmp/godot-templates.tpz             "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"

          unzip -q -o /tmp/godot-templates.tpz -d "$tmp_templates"
          test -d "$tmp_templates/templates"

          cp -a "$tmp_templates/templates/." "$templates_dir/"

          test -s "$templates_dir/version.txt"
          test -s "$templates_dir/web_nothreads_release.zip"
          test -s "$templates_dir/web_nothreads_debug.zip"
          test -s "$templates_dir/web_release.zip"
          test -s "$templates_dir/web_debug.zip"

          expected_version="${GODOT_VERSION}.stable"
          actual_version="$(head -n 1 "$templates_dir/version.txt" | tr -d '\r')"
          test "$actual_version" = "$expected_version"

          echo "Installed Godot templates:"
          ls -lh "$templates_dir/web_"*.zip

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/godot" --headless --path . --editor --quit

      - name: Run project smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 15s "$HOME/.local/bin/godot" --headless --path . --quit-after 8

      - name: Build Godot Web export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "$HOME/.local/bin/godot" --headless --path . --export-release "Web" build/web/index.html

      - name: Verify and prepare Web export
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          wasm_file="$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          pck_file="$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          test -n "$wasm_file"
          test -s "$wasm_file"
          test -n "$pck_file"
          test -s "$pck_file"

          cat > build/web/.htaccess <<'EOF'
          Options -MultiViews
          AddType application/wasm .wasm
          AddType application/octet-stream .pck
          <FilesMatch "\.(wasm|pck|js|html)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
          </FilesMatch>
          EOF

          find build/web -maxdepth 1 -type f -printf '%f\n' | sort
          printf '%s\n'             "commit=${GITHUB_SHA}"             "ref=${GITHUB_REF_NAME}"             "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"             > build/web/deployment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web

  deploy-infinityfree:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web

      - name: Verify downloaded Web export
        run: test -s build/web/index.html

      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: build/web/
          server-dir: ${{ format('{0}/', secrets.INFINITYFREE_FTP_SERVER_DIR) }}
          dangerous-clean-slate: false
