name: Deploy The Odyssey
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: odyssey-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "4.5.1-stable"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig ca-certificates curl unzip
      - name: Install Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          godot_binary="$(find /tmp/godot -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$godot_binary"
          install -m 0755 "$godot_binary" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          godot --version
      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          templates_root="$HOME/.local/share/godot/export_templates"
          templates_dir="$templates_root/${GODOT_VERSION}.stable"
          tmp_templates="$(mktemp -d)"
          mkdir -p "$templates_dir"
          curl -fsSL -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q -o /tmp/godot-templates.tpz -d "$tmp_templates"
          cp -a "$tmp_templates/templates/." "$templates_dir/"
          test -s "$templates_dir/version.txt"
          test -s "$templates_dir/web_nothreads_release.zip"
      - name: Validate Godot project
        run: godot --headless --path . --editor --quit
      - name: Run project smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 15s godot --headless --path . --quit-after 8 2>&1 | tee /tmp/odyssey-smoke.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|ERROR:.*shader|Failed to load script" /tmp/odyssey-smoke.log; then
            echo "Runtime smoke test found a Godot error:"
            grep -Ein "SCRIPT ERROR|Parse Error|ERROR:.*shader|Failed to load script" /tmp/odyssey-smoke.log
            exit 1
          fi
      - name: Build Godot Web export
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Verify Web export
        run: |
          set -euo pipefail
          test -s build/web/index.html
          wasm_file="$(find build/web -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          js_file="$(find build/web -maxdepth 1 -type f -name '*.js' -print -quit)"
          pck_file="$(find build/web -maxdepth 1 -type f -name '*.pck' -print -quit)"
          test -s "$wasm_file"
          test -s "$js_file"
          test -s "$pck_file"
          grep -q "\.wasm" build/web/index.html
          grep -q "\.pck" build/web/index.html
          printf '%s\n' "commit=${GITHUB_SHA}" "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build/web/deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
