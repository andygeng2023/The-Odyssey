name: Deploy The Odyssey
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-deploy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install CI system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig ca-certificates curl unzip
      - name: Install Godot Web export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.5.1.stable
          curl -fsSL -o /tmp/Godot_v4.5.1-stable_export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q -o /tmp/Godot_v4.5.1-stable_export_templates.tpz \
            -d /github/home/.local/share/godot/export_templates
          test -f /github/home/.local/share/godot/export_templates/4.5.1.stable/web_nothreads_release.zip
          test -f /github/home/.local/share/godot/export_templates/4.5.1.stable/web_nothreads_debug.zip
      - name: Build Godot Web export
        run: |
          mkdir -p build/web
          godot --headless --editor --quit
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Add deployment metadata
        run: |
          printf '%s\n' "commit=${GITHUB_SHA}" "ref=${GITHUB_REF_NAME}" "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build/web/deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web
  deploy-infinityfree:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: odyssey-web-${{ github.sha }}
          path: build/web
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: build/web/
          server-dir: ${{ secrets.INFINITYFREE_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
